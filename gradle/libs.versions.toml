[versions]
kotlin = "2.1.21"
sqldelight = "2.0.2"
# Usate soltanto da :androidApp, che entra nel build solo dove c'è l'SDK.
# La versione del plugin Android va cambiata anche nel `buildscript` della radice (D58).
androidGradlePlugin = "8.7.3"

[libraries]
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
# L'archivio su Android (D39). Porta con sé androidx.sqlite, che non registra nessun
# ContentProvider: l'invariante 21 è rispettato, e la cattura non lo carica mai.
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
androidApplication = { id = "com.android.application", version.ref = "androidGradlePlugin" }
