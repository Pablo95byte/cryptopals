<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #2E5AA8; } a:hover { color: #1F3F78; }
    .ui { font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif; }
    .ink { font-family: 'Caveat', 'Bradley Hand', 'Segoe Script', cursive; }
  </style>
</helmet>

<div class="ui" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBF8F1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 30px;">

  <!--
    Il vuoto ha un solo compito: portare alla prima nota. Non chiediamo di
    configurare il widget adesso — è una richiesta che non ha senso prima che
    esista qualcosa da mostrarci dentro.
  -->

  <div style="width: 152px; height: 152px; border: 2px dashed #E0D6C2; border-radius: 20px; display: flex; align-items: center; justify-content: center; transform: rotate(-3deg); margin-bottom: 38px;">
    <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#CFC4AE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20l1.2-4.2L16 5a2.2 2.2 0 0 1 3.1 3.1L8.2 18.8z"></path><path d="M5.2 15.8l3.1 3"></path>
    </svg>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;">
    <span style="font-size: 27px; font-weight: 600; color: #23201B; letter-spacing: -0.015em;">Ancora nessuna nota</span>
    <span style="font-size: 15.5px; line-height: 1.5; color: #6B6459; text-wrap: pretty;">Scrivi a mano quello che non vuoi perdere.<br>Si salva da sé, senza premere niente.</span>
  </div>

  <div style="position: absolute; left: 30px; right: 30px; bottom: 44px; display: flex; flex-direction: column; align-items: center; gap: 18px;">
    <div style="width: 100%; height: 56px; border-radius: 18px; background: #23201B; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(35,32,27,0.22);">
      <span style="font-size: 17px; font-weight: 600; color: #FBF8F1;">Scrivi la prima nota</span>
    </div>
    <span style="font-size: 13px; color: #ADA492; text-align: center;">Il widget in home si aggiunge dopo, in due tocchi.</span>
  </div>

</div>
</x-dc>
</body>
</html>
