<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; }
    a { color: #2E5AA8; } a:hover { color: #1F3F78; }
    .ui { font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif; }
    .ink { font-family: 'Caveat', 'Bradley Hand', 'Segoe Script', cursive; }
  </style>
</helmet>

<div class="ui" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: radial-gradient(110% 75% at 80% 8%, #4C5A48 0%, #33402F 45%, #232A20 100%);">

  <!-- Il launcher, che resta visibile: la cattura è una finestra trasparente sopra la home -->
  <div style="position: absolute; inset: 0; padding: 70px 20px 0 20px; display: flex; flex-direction: column; gap: 26px;">

    <div style="background: #FBF8F1; border-radius: 22px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; gap: 8px;">
        <div style="width: 74px; height: 58px; border-radius: 10px; background: #FFFDF6; border: 1px solid #EDE4D2; padding: 7px;">
          <div class="ink" style="font-size: 15px; line-height: 1.1; color: #23201B;">chiamare<br>Luca</div>
        </div>
        <div style="width: 74px; height: 58px; border-radius: 10px; background: #FBEFC6; border: 1px solid #F0E0AC; padding: 7px;">
          <div class="ink" style="font-size: 15px; line-height: 1.1; color: #2A2014;">latte, pane<br>caffè</div>
        </div>
        <div style="width: 74px; height: 58px; border-radius: 10px; background: #E6F1E7; border: 1px solid #D2E4D4; padding: 7px;">
          <div class="ink" style="font-size: 15px; line-height: 1.1; color: #1B2A1E;">podcast<br>sul vino</div>
        </div>
      </div>
      <div style="width: 44px; height: 44px; border-radius: 50%; background: #23201B; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FBF8F1" stroke-width="2.4" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"></path>
        </svg>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px 18px;">
      <div style="height: 58px; border-radius: 50%; background: rgba(255,255,255,0.18);"></div>
      <div style="height: 58px; border-radius: 50%; background: rgba(255,255,255,0.18);"></div>
      <div style="height: 58px; border-radius: 50%; background: rgba(255,255,255,0.18);"></div>
      <div style="height: 58px; border-radius: 50%; background: rgba(255,255,255,0.18);"></div>
      <div style="height: 58px; border-radius: 50%; background: rgba(255,255,255,0.18);"></div>
      <div style="height: 58px; border-radius: 50%; background: rgba(255,255,255,0.18);"></div>
      <div style="height: 58px; border-radius: 50%; background: rgba(255,255,255,0.18);"></div>
      <div style="height: 58px; border-radius: 50%; background: rgba(255,255,255,0.18);"></div>
    </div>
  </div>

  <!-- Velo: il launcher si intravede ancora, quindi non si percepisce un cambio di app -->
  <div style="position: absolute; inset: 0; background: rgba(20,24,18,0.52);"></div>

  <!-- La finestra di cattura -->
  <div style="position: absolute; left: 20px; right: 20px; top: 196px; background: #FBF8F1; border-radius: 24px; box-shadow: 0 26px 60px rgba(0,0,0,0.45); overflow: hidden;">

    <div style="position: relative; height: 286px;">
      <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(to bottom, transparent 0 34px, #EDE5D3 34px 35px); background-position: 0 54px;"></div>
      <div class="ink" style="position: relative; padding: 26px 24px 0 24px; font-size: 34px; line-height: 1.3; color: #1F2430;">
        <div style="transform: rotate(-0.6deg);">passare in farmacia</div>
        <div style="transform: rotate(0.5deg); margin-top: 2px;">prima delle 19</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 0 16px 16px 16px;">
      <div style="display: flex; gap: 8px; align-items: center;">
        <div style="width: 44px; height: 44px; border-radius: 13px; background: #F4EFE3; display: flex; align-items: center; justify-content: center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#23201B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20l1.2-4.2L16 5a2.2 2.2 0 0 1 3.1 3.1L8.2 18.8z"></path><path d="M5.2 15.8l3.1 3"></path>
          </svg>
        </div>
        <div style="width: 26px; height: 26px; border-radius: 50%; background: #1F2430; box-shadow: 0 0 0 2px #FBF8F1, 0 0 0 3.5px #1F2430;"></div>
        <div style="width: 26px; height: 26px; border-radius: 50%; background: #2E5AA8;"></div>
        <div style="width: 26px; height: 26px; border-radius: 50%; background: #B4402F;"></div>
      </div>
      <div style="flex-grow: 1;"></div>
      <div style="width: 84px; height: 48px; border-radius: 15px; background: #23201B; display: flex; align-items: center; justify-content: center; gap: 6px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FBF8F1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 13l4.5 4.5L19 7"></path>
        </svg>
        <span style="font-size: 15px; font-weight: 600; color: #FBF8F1;">OK</span>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
