<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #2E5AA8; } a:hover { color: #1F3F78; }
    .ui { font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif; }
    .ink { font-family: 'Caveat', 'Bradley Hand', 'Segoe Script', cursive; }
    .paper { background: #FBF8F1; box-shadow: 0 16px 34px rgba(0,0,0,0.28), 0 2px 4px rgba(0,0,0,0.16); }
    .tile { background: #FFFDF6; border: 1px solid #EDE4D2; border-radius: 12px; padding: 9px 10px; }
    .butter { background: #FBEFC6; border-color: #F0E0AC; }
    .mint { background: #E6F1E7; border-color: #D2E4D4; }
    .rose { background: #F8E3E4; border-color: #EFD2D4; }
    .plus { width: 44px; height: 44px; border-radius: 50%; background: #23201B; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .appname { font-size: 11px; font-weight: 500; color: rgba(245,242,235,0.82); }
    .dimapp { background: rgba(255,255,255,0.17); }
  </style>
</helmet>

<div class="ui" style="width:390px;height:844px;position:relative;overflow:hidden;background:radial-gradient(120% 85% at 60% 0%, #7C6B86 0%, #52465C 45%, #2E2635 100%)">
  <div style="padding:74px 20px 0 20px;display:flex;flex-direction:column;gap:26px">
    <div class="paper" style="border-radius:30px;padding:14px;height:340px;display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 0 0 6px">
        <span class="ink" style="font-size:24px;font-weight:700;color:#23201B;line-height:1">InkNote</span>
        <div class="plus"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FBF8F1" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px;flex-grow:1">
        <div class="tile" style="padding:11px 12px;border-radius:16px"><div class="ink" style="font-size:21px;line-height:1.13;color:#23201B;transform:rotate(-1deg)">riunione<br>giovedì 15</div></div>
        <div class="tile butter" style="padding:11px 12px;border-radius:16px"><div class="ink" style="font-size:21px;line-height:1.13;color:#2A2014;transform:rotate(0.7deg)">latte, pane,<br>caffè</div></div>
        <div class="tile mint" style="padding:11px 12px;border-radius:16px;display:flex;flex-direction:column;gap:6px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B4402F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"></path><path d="M12 18v3"></path></svg>
          <div style="font-size:12.5px;line-height:1.3;color:#28362A;text-wrap:pretty">passare in farmacia prima delle 19</div>
        </div>
        <div class="tile rose" style="padding:11px 12px;border-radius:16px"><div class="ink" style="font-size:21px;line-height:1.13;color:#2B1C1D;transform:rotate(0.9deg)">via Manzoni 14<br>citofono Rossi</div></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px">
      <div style="display:flex;flex-direction:column;align-items:center;gap:7px">
        <div class="dimapp" style="width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.72)" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="6" width="18" height="14" rx="3"></rect><circle cx="12" cy="13" r="3.6"></circle><path d="M9 6l1.4-2h3.2L15 6"></path></svg></div>
        <span class="appname">Fotocamera</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:7px">
        <div class="dimapp" style="width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.72)" stroke-width="1.6" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="16" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg></div>
        <span class="appname">Calendario</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:7px">
        <div class="dimapp" style="width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.72)" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="17.5" r="2.6"></circle><circle cx="17.5" cy="15.5" r="2.6"></circle><path d="M9.6 17.5V7l10.5-2v10.5"></path></svg></div>
        <span class="appname">Musica</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:7px">
        <div class="dimapp" style="width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.72)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-5 2V6l5-2 6 2 5-2v16l-5 2z"></path><path d="M9 4v16M15 6v16"></path></svg></div>
        <span class="appname">Mappe</span>
      </div>
    </div>
  </div>
<div style="position:absolute;left:14px;right:14px;bottom:26px;background:rgba(255,255,255,0.14);border-radius:28px;padding:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px">
    <div style="height:58px;border-radius:29px;background:rgba(255,255,255,0.2)"></div>
    <div style="height:58px;border-radius:29px;background:rgba(255,255,255,0.2)"></div>
    <div style="height:58px;border-radius:29px;background:rgba(255,255,255,0.2)"></div>
    <div style="height:58px;border-radius:29px;background:rgba(255,255,255,0.2)"></div>
  </div>
</div>
