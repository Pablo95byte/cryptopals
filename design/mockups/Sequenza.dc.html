<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #2E5AA8; } a:hover { color: #1F3F78; }
    .ui { font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif; }
    .ink { font-family: 'Caveat', 'Bradley Hand', 'Segoe Script', cursive; }
    .sheet { background: #FBF8F1; box-shadow: 0 16px 34px rgba(0,0,0,0.30), 0 2px 4px rgba(0,0,0,0.16); }
    .appname { font-size: 11px; font-weight: 500; color: rgba(245,242,235,0.82); }
    .dimapp { background: rgba(255,255,255,0.17); }
    .lbl { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(243,239,230,0.62); }
    .sub { font-size: 11.5px; color: rgba(243,239,230,0.42); }
  </style>
</helmet>

<div class="ui" style="width:1200px;height:900px;background:#1C1F26;padding:34px 36px;box-sizing:border-box;display:flex;gap:34px;align-items:flex-start">
  <!--
    La sequenza intera. È questa, e non la home, quello che si può mostrare nelle
    schede degli store: con il widget bianco la vetrina non è più la home piena di
    bigliettini, è la rapidità del gesto.
  -->
  <div style="display:flex;flex-direction:column;gap:14px;width:340px">
    <div style="display:flex;flex-direction:column;gap:4px">
      <div class="lbl">1 · tocchi il foglio</div>
      <div class="sub" style="line-height:1.4">In qualunque punto. Nessun pulsante da centrare.</div>
    </div>
    <div style="width:340px;height:736px;position:relative;overflow:hidden;border-radius:36px;background:radial-gradient(120% 90% at 20% 0%, #C9B79C 0%, #9E8E79 40%, #6E6353 100%)">

        <div class="sheet" style="border-radius:21px;height:143px;display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#D9CEB8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5c3-1 5-6.5 8-11.5 2.2-3.7 4-4.3 4.8-3.4.9 1-.4 3.2-2.4 5.6-1.6 1.9-3 3-3 4.3 0 1 .8 1.5 1.8 1.2 1.4-.4 2.6-1.6 3.8-3.2"></path></svg></div>
      </div>
      <div style="position:absolute;left:19px;right:19px;top:250px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px">
        <div style="height:52px;border-radius:13px;background:#FBF8F1;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#23201B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5c3-1 5-6.5 8-11.5 2.2-3.7 4-4.3 4.8-3.4.9 1-.4 3.2-2.4 5.6-1.6 1.9-3 3-3 4.3 0 1 .8 1.5 1.8 1.2 1.4-.4 2.6-1.6 3.8-3.2"></path></svg></div>
        <div class="dimapp" style="height:52px;border-radius:13px"></div>
        <div class="dimapp" style="height:52px;border-radius:13px"></div>
        <div class="dimapp" style="height:52px;border-radius:13px"></div>
      </div>
      <div style="position:absolute;left:12px;right:12px;bottom:22px;background:rgba(255,255,255,0.14);border-radius:24px;padding:10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">
        <div style="height:50px;border-radius:12px;background:rgba(255,255,255,0.2)"></div>
        <div style="height:50px;border-radius:12px;background:rgba(255,255,255,0.2)"></div>
        <div style="height:50px;border-radius:12px;background:rgba(255,255,255,0.2)"></div>
        <div style="height:50px;border-radius:12px;background:rgba(255,255,255,0.2)"></div>
      </div>
      <div style="position:absolute;left:168px;top:152px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,0.32);border:2px solid rgba(255,255,255,0.7)"></div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:14px;width:340px">
    <div style="display:flex;flex-direction:column;gap:4px">
      <div class="lbl">2 · scrivi</div>
      <div class="sub" style="line-height:1.4">Il foglio è già aperto e accetta il primo tratto subito.</div>
    </div>
    <div style="width:340px;height:736px;position:relative;overflow:hidden;border-radius:36px;background:#FBF8F1">
      <div style="position:absolute;inset:0;background-image:repeating-linear-gradient(to bottom, transparent 0 31px, #EDE5D3 31px 32px);background-position:0 92px"></div>
      <div class="ink" style="position:relative;padding:96px 24px 0 24px;font-size:33px;line-height:1.3;color:#1F2430">
        <div style="transform:rotate(-0.7deg)">riunione giovedì 15</div>
        <div style="transform:rotate(0.4deg);margin-top:2px">portare il preventivo</div>
      </div>
      <div style="position:absolute;right:18px;bottom:24px;width:82px;height:50px;border-radius:16px;background:#23201B;display:flex;align-items:center;justify-content:center;gap:6px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FBF8F1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4.5 4.5L19 7"></path></svg>
        <span style="font-size:15px;font-weight:600;color:#FBF8F1">OK</span>
      </div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:14px;width:340px">
    <div style="display:flex;flex-direction:column;gap:4px">
      <div class="lbl">3 · OK — e la home è come prima</div>
      <div class="sub" style="line-height:1.4">Niente si accumula, niente da leggere, niente da chiudere.</div>
    </div>
    <div style="width:340px;height:736px;position:relative;overflow:hidden;border-radius:36px;background:radial-gradient(120% 90% at 20% 0%, #C9B79C 0%, #9E8E79 40%, #6E6353 100%)">
      <div style="padding:68px 19px 0 19px">
        <div class="sheet" style="border-radius:21px;height:143px;display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#D9CEB8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5c3-1 5-6.5 8-11.5 2.2-3.7 4-4.3 4.8-3.4.9 1-.4 3.2-2.4 5.6-1.6 1.9-3 3-3 4.3 0 1 .8 1.5 1.8 1.2 1.4-.4 2.6-1.6 3.8-3.2"></path></svg></div>
      </div>
      <div style="position:absolute;left:19px;right:19px;top:250px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px">
        <div style="height:52px;border-radius:13px;background:#FBF8F1;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#23201B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5c3-1 5-6.5 8-11.5 2.2-3.7 4-4.3 4.8-3.4.9 1-.4 3.2-2.4 5.6-1.6 1.9-3 3-3 4.3 0 1 .8 1.5 1.8 1.2 1.4-.4 2.6-1.6 3.8-3.2"></path></svg></div>
        <div class="dimapp" style="height:52px;border-radius:13px"></div>
        <div class="dimapp" style="height:52px;border-radius:13px"></div>
        <div class="dimapp" style="height:52px;border-radius:13px"></div>
      </div>
      <div style="position:absolute;left:12px;right:12px;bottom:22px;background:rgba(255,255,255,0.14);border-radius:24px;padding:10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">
        <div style="height:50px;border-radius:12px;background:rgba(255,255,255,0.2)"></div>
        <div style="height:50px;border-radius:12px;background:rgba(255,255,255,0.2)"></div>
        <div style="height:50px;border-radius:12px;background:rgba(255,255,255,0.2)"></div>
        <div style="height:50px;border-radius:12px;background:rgba(255,255,255,0.2)"></div>
      </div>
      
    </div>
  </div>
</div>
</x-dc>
