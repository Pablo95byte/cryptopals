<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #2E5AA8; } a:hover { color: #1F3F78; }
    .ui { font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif; }
    .ink { font-family: 'Caveat', 'Bradley Hand', 'Segoe Script', cursive; }
    .paper { background: #FBF8F1; box-shadow: 0 16px 34px rgba(0,0,0,0.28), 0 2px 4px rgba(0,0,0,0.16); }
    .tile { background: #FFFDF6; border: 1px solid #EDE4D2; border-radius: 12px; padding: 9px 10px; }
    .butter { background: #FBEFC6; border-color: #F0E0AC; }
    .mint { background: #E6F1E7; border-color: #D2E4D4; }
    .rose { background: #F8E3E4; border-color: #EFD2D4; }
    .plus { width: 44px; height: 44px; border-radius: 50%; background: #23201B; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .appname { font-size: 11px; font-weight: 500; color: rgba(245,242,235,0.82); }
    .dimapp { background: rgba(255,255,255,0.17); }
  </style>
</helmet>

<div class="ui" style="width:390px;height:844px;position:relative;overflow:hidden;background:radial-gradient(120% 85% at 60% 0%, #6B7A86 0%, #46525C 45%, #262E35 100%)">
  <!-- Su iPhone non si può scrivere sopra il blocco (D17): il widget qui è la strada
       più corta, perché Face ID e apertura del foglio diventano un gesto solo. -->
  <div style="padding:96px 26px 0 26px;display:flex;flex-direction:column;align-items:center;gap:4px">
    <span style="font-size:15px;font-weight:500;color:rgba(245,242,235,0.78)">sabato 12 settembre</span>
    <span style="font-size:74px;font-weight:400;color:#F5F2EB;line-height:1.05;letter-spacing:-0.02em">9:41</span>
  </div>

  <div style="padding:34px 22px 0 22px">
    <div style="background:rgba(20,22,25,0.32);border:1px solid rgba(255,255,255,0.18);border-radius:20px;padding:13px 15px;display:flex;align-items:center;gap:13px">
      <div style="width:52px;height:52px;border-radius:12px;background:#FBF8F1;padding:7px;flex-shrink:0">
        <div class="ink" style="font-size:14px;line-height:1.1;color:#23201B">passare in<br>farmacia</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:3px;flex-grow:1">
        <span class="ink" style="font-size:21px;color:#F5F2EB;line-height:1">InkNote</span>
        <span style="font-size:11.5px;color:rgba(245,242,235,0.62)">tocca per scrivere</span>
      </div>
      <div style="width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#23201B" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
