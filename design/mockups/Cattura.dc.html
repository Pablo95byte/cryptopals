<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #2E5AA8; } a:hover { color: #1F3F78; }
    .ui { font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif; }
    .ink { font-family: 'Caveat', 'Bradley Hand', 'Segoe Script', cursive; }
  </style>
</helmet>

<div class="ui" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBF8F1;">

  <!--
    Lo stato di apertura, e non c'è niente dentro.
    Nessuna intestazione, nessun selettore di carta, nessuna barra delle punte:
    ogni comando visibile prima del primo tratto è una decisione chiesta a chi non
    vuole decidere niente. Le punte compaiono dopo, quando serve correggere.
  -->
  <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(to bottom, transparent 0 35px, #EDE5D3 35px 36px); background-position: 0 96px;"></div>

  <div class="ink" style="position: relative; padding: 104px 26px 0 26px; font-size: 38px; line-height: 1.28; color: #1F2430;">
    <div style="transform: rotate(-0.7deg);">riunione giovedì 15</div>
    <div style="transform: rotate(0.4deg); margin-top: 2px;">portare il preventivo</div>
    <div style="transform: rotate(-0.3deg); margin-top: 2px;">e le foto del cantiere</div>
  </div>

  <!--
    L'unico comando. E non salva: la nota è già al sicuro dal primo tratto,
    tramite il giornale di scrittura. Questo dice soltanto "ho finito, riportami
    alla home" (decisione D5).
  -->
  <div style="position: absolute; right: 20px; bottom: 28px; width: 92px; height: 56px; border-radius: 18px; background: #23201B; display: flex; align-items: center; justify-content: center; gap: 7px; box-shadow: 0 8px 20px rgba(35,32,27,0.28);">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FBF8F1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 13l4.5 4.5L19 7"></path>
    </svg>
    <span style="font-size: 16px; font-weight: 600; color: #FBF8F1;">OK</span>
  </div>

</div>
</x-dc>
</body>
</html>
