<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #2E5AA8; } a:hover { color: #1F3F78; }
    .ui { font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif; }
    .ink { font-family: 'Caveat', 'Bradley Hand', 'Segoe Script', cursive; }
    .group { font-size: 11.5px; font-weight: 600; color: #8B8374; letter-spacing: 0.05em; text-transform: uppercase; }
    .row { min-height: 56px; background: #FFFDF6; border: 1px solid #EDE4D2; border-radius: 14px; display: flex; align-items: center; gap: 13px; padding: 0 15px; }
    .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #CFC4AE; flex-shrink: 0; }
  </style>
</helmet>

<div class="ui" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F1E7;">

  <div style="display: flex; align-items: center; gap: 4px; padding: 58px 14px 0 14px;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#23201B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 5l-7 7 7 7"></path>
      </svg>
    </div>
    <span style="font-size: 17px; font-weight: 600; color: #23201B;">Widget</span>
  </div>

  <div style="padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 20px;">

    <!-- L'anteprima cambia con le scelte sotto: si vede quello che si sta decidendo. -->
    <div style="background: #FBF8F1; border-radius: 22px; padding: 13px; box-shadow: 0 6px 18px rgba(35,32,27,0.10); display: flex; gap: 10px;">
      <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
        <div style="height: 84px; background: #FFFDF6; border: 1px solid #EDE4D2; border-radius: 11px; padding: 8px 9px;">
          <div class="ink" style="font-size: 17px; line-height: 1.1; color: #23201B; transform: rotate(-1deg);">chiamare<br>Luca</div>
        </div>
        <div style="height: 84px; background: #FBEFC6; border: 1px solid #F0E0AC; border-radius: 11px; padding: 8px 9px;">
          <div class="ink" style="font-size: 17px; line-height: 1.1; color: #2A2014; transform: rotate(0.8deg);">latte,<br>pane,<br>caffè</div>
        </div>
        <div style="height: 84px; background: #E6F1E7; border: 1px solid #D2E4D4; border-radius: 11px; padding: 8px 9px;">
          <div class="ink" style="font-size: 17px; line-height: 1.1; color: #1B2A1E; transform: rotate(-0.5deg);">podcast<br>sul vino</div>
        </div>
      </div>
      <div style="width: 44px; display: flex; align-items: center;">
        <div style="width: 44px; height: 44px; border-radius: 50%; background: #23201B; display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FBF8F1" stroke-width="2.4" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <span class="group">Cosa mostra</span>
      <div class="row">
        <div class="radio" style="border-color: #23201B; border-width: 6px;"></div>
        <span style="font-size: 15.5px; color: #23201B; flex-grow: 1;">Le note più recenti</span>
      </div>
      <div class="row">
        <div class="radio"></div>
        <span style="font-size: 15.5px; color: #23201B; flex-grow: 1;">Una nota fissata</span>
      </div>
      <div class="row">
        <div class="radio"></div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; padding: 9px 0;">
          <span style="font-size: 15.5px; color: #23201B;">Solo il pulsante per scrivere</span>
          <span style="font-size: 12px; color: #ADA492;">nessuna nota visibile sulla home</span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <span class="group">Formato</span>
      <div style="display: flex; gap: 8px;">
        <div style="flex-grow: 1; height: 48px; border-radius: 13px; background: #FFFDF6; border: 1px solid #EDE4D2; display: flex; align-items: center; justify-content: center;">
          <span style="font-size: 14px; font-weight: 500; color: #6B6459;">Piccolo</span>
        </div>
        <div style="flex-grow: 1; height: 48px; border-radius: 13px; background: #23201B; display: flex; align-items: center; justify-content: center;">
          <span style="font-size: 14px; font-weight: 600; color: #FBF8F1;">Medio</span>
        </div>
        <div style="flex-grow: 1; height: 48px; border-radius: 13px; background: #FFFDF6; border: 1px solid #EDE4D2; display: flex; align-items: center; justify-content: center;">
          <span style="font-size: 14px; font-weight: 500; color: #6B6459;">Grande</span>
        </div>
      </div>
    </div>

    <!-- Il limite del livello gratuito, detto dove si incontra e non a sorpresa (D4). -->
    <div class="row" style="background: #F7EDCC; border-color: #EBDCA8;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B7A46" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
        <rect x="4.5" y="10.5" width="15" height="9.5" rx="2.2"></rect><path d="M8 10.5V7.2a4 4 0 0 1 8 0v3.3"></path>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; padding: 9px 0;">
        <span style="font-size: 14.5px; font-weight: 500; color: #5E5222;">Più di un widget</span>
        <span style="font-size: 12px; color: #8B7A46;">incluso in Pro, 6,99 € una volta sola</span>
      </div>
    </div>

  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 30px; height: 56px; border-radius: 18px; background: #23201B; display: flex; align-items: center; justify-content: center;">
    <span style="font-size: 17px; font-weight: 600; color: #FBF8F1;">Salva</span>
  </div>

</div>
</x-dc>
</body>
</html>
