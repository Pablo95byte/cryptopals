name: core

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test del core condiviso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepara JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@v4

      # I target iOS non si compilano su Linux: jvmTest è la verifica completa
      # della logica condivisa, che è dove stanno i bug veri (vedi CLAUDE.md, §7).
      - name: Test
        run: ./gradlew jvmTest --stacktrace

      - name: Conserva i referti dei test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/build/test-results/jvmTest/*.xml"
          if-no-files-found: warn
